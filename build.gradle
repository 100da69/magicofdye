plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'com.magicofdye'
version = '1.0.0'

base {
    archivesName = 'magicofdye-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = '21.1.172'

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: version)
    }
}

sourceSets {
    main {
        java {
            // Ignore legacy Forge/ModLoader-era sample sources if they exist in local copied workspaces.
            exclude 'com/towadaroku/magicofdye/**'
        }
    }
}
